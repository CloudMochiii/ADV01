<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="navbar"></div>

<div class="auth-container">

    <div class="room-card auth-card">

        <h1>Create Student Account</h1>

        <form method="POST" enctype="multipart/form-data">

            <input
                class="form-input"
                type="text"
                name="student_name"
                placeholder="Full Name"
                required>

            <br><br>

            <input
                class="form-input"
                type="text"
                name="student_id"
                placeholder="Student ID"
                required>

            <br><br>

            <input
                class="form-input"
                type="email"
                name="email"
                placeholder="Student Email"
                required>

            <br><br>

            <input
                class="form-input"
                type="text"
                name="phone"
                placeholder="Phone Number"
                required>

            <br><br>

            <select
                class="form-input"
                name="gender"
                required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

            </select>

            <br><br>

            <input
                class="form-input"
                type="password"
                name="password"
                placeholder="Password"
                required>

            <br><br>

            <input
                class="form-input"
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required>

            <br><br>

            <label>
                Upload Student ID
            </label>

            <br><br>

            <input
                type="file"
                name="student_id_image"
                accept="image/*"
                required>

            <br><br>

            <button
                class="reserve-btn"
                type="submit">

                Create Account

            </button>

        </form>

    </div>

</div>

</body>
</html>
